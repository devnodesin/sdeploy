# SDeploy Secrets Overlay (example)
#
# This file is meant to be merged with the main sdeploy.conf using the -c flag:
#
#   sdeploy -c /etc/sdeploy.conf,/etc/secrets.conf
#
# Rules:
#   - Later files override earlier files for the same key.
#   - Maps merge key-by-key; projects merge by webhook_path, so you only need to
#     restate the fields you want to override (e.g. webhook_secret) for a project
#     that already exists, or add a brand-new project with its own webhook_path.
#   - Missing/unreadable files are skipped, so this overlay can be optional.
#
# Keep this file OUT of version control (mount it at runtime instead).

email_config:
  # Override only the password from the main config
  smtp_pass: your_smtp_password_or_api_key

projects:
  # Patch the project whose webhook_path is /wh/app (fields you omit are inherited)
  - webhook_path: /wh/app
    webhook_secret: project_specific_webhook_secret
  # A project with a new webhook_path is added as a separate project
  # - name: other
  #   webhook_path: /wh/other
  #   webhook_secret: other_secret
  #   git_repo: git@github.com:org/other.git
  #   execute_command: sh build.sh
